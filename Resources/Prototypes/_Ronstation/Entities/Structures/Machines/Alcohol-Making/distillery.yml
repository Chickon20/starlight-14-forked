- type: entity
  id: distillery
  parent: BaseMachinePowered
  name: Distillery
  description: A distillery for concentrating substances.
  Powered by logs.
  components:
  - type: Sprite
    sprite: _Ronstation/alcohol-making/distillery.rsi
    snapCardinals: true
    drawdepth: Mobs
    layers:
      - state: standby
        map: ["base"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.8,-0.5,0.6,-0.2"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ItemSlots
    slots:
      log_slot:
        name: distillery-log-slot
        whitelist:
          components:
          - Log
  - type: ContainerContainer
    containers:
      log_slot: !type:ContainerSlot
  - type: Battery
    maxCharge: 10000
    startingCharge: 0
  - type: ExaminableBattery
  - type: ChildEntities
    childPrototypes:
    - prototype: DistilleryInput
      offset: -0.45, 0.1
    - prototype: DistilleryOutput
      offset: 0.45, -0.4
    - prototype: DistilleryCoolant
      offset: 0.45, 0.2

- type: entity
  id: DistilleryInput
  name: distillery input
  description: The distillery's input reservoir.
  categories: [ HideSpawnMenu ]
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: OverMobs
    sprite: Objects/Specific/Chemistry/beaker.rsi
    layers:
    - state: beaker
      color: "#C78B48"
  - type: SolutionContainerManager
    solutions:
      alcohol:
        maxVol: 400
  - type: DrainableSolution
    solution: alcohol
  - type: RefillableSolution
    solution: alcohol
  - type: ExaminableSolution
    solution: alcohol
    exactVolume: true

- type: entity
  id: DistilleryOutput
  name: distillery output
  description: The distillery's output reservoir.
  categories: [ HideSpawnMenu ]
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: OverMobs
    sprite: Objects/Specific/Chemistry/beaker.rsi
    layers:
    - state: beaker
      color: "#E6D5A8"
  - type: SolutionContainerManager
    solutions:
      fine_alcohol:
        maxVol: 100
  - type: DrainableSolution
    solution: fine_alcohol
  - type: ExaminableSolution
    solution: fine_alcohol
    exactVolume: true

- type: entity
  id: DistilleryCoolant
  name: distillery coolant
  description: The distillery's coolant reservoir.
  categories: [ HideSpawnMenu ]
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: OverMobs
    sprite: Objects/Specific/Chemistry/beaker.rsi
    layers:
    - state: beaker
      color: "#69B6D4"
  - type: SolutionContainerManager
    solutions:
      coolant:
        maxVol: 200
  - type: DrainableSolution
    solution: coolant
  - type: RefillableSolution
    solution: coolant
  - type: RefillReagentFilter
    reagents:
    - Water
  - type: ExaminableSolution
    solution: coolant
    exactVolume: true
